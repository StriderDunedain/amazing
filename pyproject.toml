[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mazegen"
version = "0.1.0"
description = "Reusable maze generator for the 42 A-Maze-ing project"
readme = "README.md"
requires-python = ">=3.10"
license = "GPL-3.0-or-later"
license-files = ["LICENSE.md"]
authors = [{name = "mtrukhin"}]

[project.optional-dependencies]
dev = ["build>=1.2", "flake8>=7.0", "mypy>=1.10"]

[tool.setuptools.packages.find]
include = ["mazegen*"]

[tool.ruff]
target-version = "py310"
exclude = [".venv", "mlx_CLXV"]

[tool.ruff.lint]
select = ["B", "BLE", "E4", "E7", "E9", "F", "I", "ISC", "PYI", "RUF", "UP"]

[tool.mypy]
python_version = "3.10"
strict = true
exclude = "^(mlx_CLXV|\\.venv)/"
